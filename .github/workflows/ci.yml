# 在 Linux 和 Windows 上跑测试（需求 13.5）。换行和大小写这类只在一边暴露的问题早发现（任务 2）。
# Windows 作业（任务 8）：GitHub 的 Windows 机器默认 core.autocrlf=true，checkout 出来的文本文件是 CRLF，
# 和评委在 Windows 上新克隆的情况一样。
# 两个作业都装 ffmpeg：镜头应用的测试要用它现场生成测试视频（镜头应用需求 7.3）；核心层不依赖它。
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Linux 上 checkout 不做换行转换；*.jsonl 另由 .gitattributes 的 -text 保证原样
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: python -m pytest
  test-windows:
    runs-on: windows-latest
    steps:
      # 不改 core.autocrlf：保留 Windows 机器的默认值，*.md 等文本文件按 CRLF 检出
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install ffmpeg
        run: choco install ffmpeg -y
      - name: Test
        run: python -m pytest
