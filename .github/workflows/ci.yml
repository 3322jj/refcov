# 在 Linux 上跑测试（需求 13.5）。换行和大小写这类只在 Linux 上暴露的问题早发现（任务 2）。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Linux 上 checkout 不做换行转换；*.jsonl 另由 .gitattributes 的 -text 保证原样
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
