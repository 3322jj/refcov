[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refcov"
version = "0.0.1"
description = "Coverage for reference material: record which units an AI actually fetched."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# 运行时只有 MCP 服务模块（refcov_mcp）依赖第三方包；核心层 refcov/ 只用标准库。
dependencies = ["mcp"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
refcov = "refcov.cli:main"

[tool.setuptools.packages.find]
include = ["refcov*", "refcov_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
